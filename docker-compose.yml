services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: comovota
      POSTGRES_PASSWORD: comovota
      POSTGRES_DB: comovota
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comovota -d comovota"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["/app/etl", "migrate"]
    environment:
      DATABASE_URL: postgres://comovota:comovota@db:5432/comovota?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: ["/app/api"]
    environment:
      DATABASE_URL: postgres://comovota:comovota@db:5432/comovota?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["app"]

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
    profiles: ["app"]

volumes:
  pgdata:
