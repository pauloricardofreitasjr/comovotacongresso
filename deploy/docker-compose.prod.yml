# Produção em uma máquina só (VPS). Uso, a partir da raiz do repositório:
#   docker compose --env-file deploy/.env.prod -f deploy/docker-compose.prod.yml up -d --build
# Só o Caddy publica portas (80/443); banco e API ficam na rede interna.
name: comovotacongresso

x-db-url: &db-url postgres://comovota:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@db:5432/comovota?sslmode=disable

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: comovota
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: comovota
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comovota -d comovota"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ..
    command: ["/app/etl", "migrate"]
    environment:
      DATABASE_URL: *db-url
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ..
    restart: unless-stopped
    command: ["/app/api"]
    environment:
      DATABASE_URL: *db-url
      HTTP_ADDR: ":8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
    depends_on:
      - api

  etl:
    build: ..
    restart: unless-stopped
    command: ["/app/etl", "agendar"]
    environment:
      DATABASE_URL: *db-url
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      DAILY_EVERY: ${DAILY_EVERY:-2h}
    healthcheck:
      # falha se o último daily bem-sucedido tiver mais de 6h
      test: ["CMD", "/app/etl", "saude", "-max", "6h"]
      interval: 5m
      timeout: 30s
      retries: 1
      start_period: 15m
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    build: ./caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: comovota
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: comovota
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backups:
